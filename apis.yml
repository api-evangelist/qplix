aid: qplix
name: QPLIX
description: 'QPLIX GmbH is a Munich-based wealth management software company offering
  QPLIX-Q, an all-in-one SaaS platform for professional investors, family offices,
  asset managers, and banks to consolidate, manage, and report on multi-asset-class
  portfolios. The platform automates portfolio management, trading and rebalancing,
  accounting, tax, and client reporting, integrating direct data feeds from 150+ custodian
  banks (UBS, Julius Baer, Deutsche Bank, and others) and leading market-data providers
  (LSEG, Moody''s, S&P Dow Jones Indices, ISS ESG). QPLIX runs a self-hosted, API-based
  infrastructure on ISO 27001-certified European data centers, holds an ISAE 3402
  attestation, and is registered with Germany''s BaFin as an account information service
  provider (AISP). The company does not publish a public developer API or portal;
  integrations are delivered as managed add-ons and there is no OpenAPI, SDK, or developer
  documentation surface.'
